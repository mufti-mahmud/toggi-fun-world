version: '3.8'

services:
  tfw-ticket-api:
    build: .
    container_name: tfw-ticket-sales-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_KEY=tfw-full-access-key-2026
      - OPERATIONAL_TIMEZONE=Asia/Dhaka
      - CURRENCY=BDT
    volumes:
      - ./data:/app/data
